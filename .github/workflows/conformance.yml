name: AGP Conformance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: agp-conformance-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.23.x"

      - name: Install Python dependencies
        run: python -m pip install --require-hashes -r requirements-ci-lock.txt

      - name: Run historical AGP suites
        run: python3 run_benchmark_all.py

      - name: Run Signed Decision Context suites
        run: |
          python signed_decision_context/tools/run_conformance.py
          python signed_decision_context/tools/run_cross_language_conformance.py
          python signed_decision_context/tools/run_crypto_conformance.py
          python signed_decision_context/tools/run_crypto_cross_language_conformance.py
          python signed_decision_context/tools/run_signer_conformance.py
          python signed_decision_context/tools/run_signer_v2_conformance.py
          python signed_decision_context/tools/run_signer_v3_conformance.py
          python signed_decision_context/tools/run_append_signer_conformance.py
