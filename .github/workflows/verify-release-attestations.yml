name: Verify Release Attestations

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tpe-v release tag to verify
        required: true
        type: string

permissions:
  contents: read
  attestations: read

concurrency:
  group: verify-release-attestations-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Validate release tag input
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$RELEASE_TAG" in
            tpe-v*) ;;
            *)
              printf 'Release tag must start with tpe-v: %s\n' "$RELEASE_TAG" >&2
              exit 1
              ;;
          esac

      - name: Check out released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          python trust_primitive_engine/tools/verify_release_attestations.py \
            --tag "$RELEASE_TAG" \
            --repository agpprotocol/agp \
            --signer-workflow agpprotocol/agp/.github/workflows/publish-pypi.yml \
            --output-dir release-verification-report

      - name: Publish verification summary
        if: always()
        run: |
          if [ -f release-verification-report/verification-summary.md ]; then
            cat release-verification-report/verification-summary.md \
              >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Release verification report was not produced.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ inputs.tag }}
          path: release-verification-report/
          if-no-files-found: error
          retention-days: 90
