name: Publish AGP TPE to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: write

concurrency:
  group: publish-agp-tpe-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish agp-tpe
    if: startsWith(github.event.release.tag_name, 'tpe-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: pypi
      url: https://pypi.org/project/agp-tpe/

    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Run release readiness preflight
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python trust_primitive_engine/tools/release_readiness_preflight.py \
            --tag "$RELEASE_TAG" \
            --source-dir . \
            --expected-package agp-tpe \
            --pypi-base-url https://pypi.org/pypi

      - name: Install build validation tools
        run: python -m pip install --require-hashes -r requirements-release-lock.txt

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Generate release SBOM
        run: |
          wheel_file="$(find dist -maxdepth 1 -type f -name '*.whl' -print -quit)"
          sdist_file="$(find dist -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          python trust_primitive_engine/tools/generate_release_sbom.py \
            --wheel "$wheel_file" \
            --sdist "$sdist_file" \
            --output release-assets/agp-tpe.cdx.json
          python -m json.tool release-assets/agp-tpe.cdx.json > /dev/null

      - name: Generate release checksums
        working-directory: dist
        run: |
          export LC_ALL=C
          printf '%s\n' *.whl *.tar.gz | sort > /tmp/release-files.txt
          xargs sha256sum -- < /tmp/release-files.txt > SHA256SUMS
          checksum_entries="$(wc -l < SHA256SUMS | tr -d ' ')"
          [ "$checksum_entries" -eq 2 ]
          cat SHA256SUMS

      - name: Verify release checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Show distribution contents
        run: |
          python -m zipfile --list dist/*.whl
          tar -tzf dist/*.tar.gz

      - name: Attest release build provenance
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            dist/SHA256SUMS
            release-assets/agp-tpe.cdx.json

      - name: Attest release SBOM
        uses: actions/attest@508db95dd578ae2727ebd6217d5ba78e4fbda05d # v4.2.1
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
          sbom-path: release-assets/agp-tpe.cdx.json

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

      - name: Attach checksums to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" \
            dist/*.whl \
            dist/*.tar.gz \
            dist/SHA256SUMS \
            release-assets/agp-tpe.cdx.json \
            --clobber

      - name: Verify published release attestations
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          python trust_primitive_engine/tools/verify_release_attestations.py \
            --tag "$RELEASE_TAG" \
            --repository agpprotocol/agp \
            --signer-workflow agpprotocol/agp/.github/workflows/publish-pypi.yml \
            --output-dir release-verification-report

      - name: Publish release verification summary
        if: always()
        run: |
          if [ -f release-verification-report/verification-summary.md ]; then
            cat release-verification-report/verification-summary.md \
              >> "$GITHUB_STEP_SUMMARY"
          else
            printf 'Release verification report was not produced.\n' \
              >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload release verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-verification-${{ github.event.release.tag_name }}
          path: release-verification-report/
          if-no-files-found: error
          retention-days: 90
