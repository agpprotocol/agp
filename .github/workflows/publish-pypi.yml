name: Publish AGP TPE to PyPI

on:
  release:
    types:
      - published

permissions:
  contents: read

concurrency:
  group: publish-agp-tpe-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish agp-tpe
    if: startsWith(github.event.release.tag_name, 'tpe-v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    environment:
      name: pypi
      url: https://pypi.org/project/agp-tpe/

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out the released tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Verify tag and package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          pyproject = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )

          project = pyproject["project"]
          package_name = project["name"]
          package_version = project["version"]

          expected_tag = f"tpe-v{package_version}"
          release_tag = os.environ["RELEASE_TAG"]

          print(f"Package: {package_name}")
          print(f"Version: {package_version}")
          print(f"Release tag: {release_tag}")
          print(f"Expected tag: {expected_tag}")

          if package_name != "agp-tpe":
              raise SystemExit(
                  f"Unexpected package name: {package_name!r}"
              )

          if release_tag != expected_tag:
              raise SystemExit(
                  "Release tag does not match pyproject.toml version: "
                  f"{release_tag!r} != {expected_tag!r}"
              )

          print("TAG_VERSION_MATCH_PASS")
          PY

      - name: Verify checkout matches released tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          test "$(git rev-parse HEAD)" = \
            "$(git rev-list -n 1 "$RELEASE_TAG")"

          echo "RELEASE_TAG_CHECKOUT_PASS"

      - name: Refuse an existing PyPI version
        run: |
          python - <<'PY'
          import json
          import tomllib
          import urllib.error
          import urllib.request
          from pathlib import Path

          pyproject = tomllib.loads(
              Path("pyproject.toml").read_text(encoding="utf-8")
          )
          project = pyproject["project"]

          name = project["name"]
          version = project["version"]
          url = f"https://pypi.org/pypi/{name}/{version}/json"

          try:
              with urllib.request.urlopen(url, timeout=20) as response:
                  payload = json.load(response)
          except urllib.error.HTTPError as exc:
              if exc.code == 404:
                  print(
                      f"PYPI_VERSION_AVAILABLE: {name}=={version}"
                  )
              else:
                  raise
          else:
              published = payload["info"]["version"]
              raise SystemExit(
                  f"Refusing to republish existing version: "
                  f"{name}=={published}"
              )
          PY

      - name: Install build validation tools
        run: python -m pip install --require-hashes -r requirements-release-lock.txt

      - name: Build distributions
        run: python -m build --no-isolation

      - name: Validate distributions
        run: python -m twine check dist/*

      - name: Show distribution contents
        run: |
          python -m zipfile --list dist/*.whl
          tar -tzf dist/*.tar.gz

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
